<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartChat | AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">

        <!-- Chat Header -->
        <header class="chat-header">
            <div class="logo">S</div>
            <div class="header-text">
                <h2>SmartChat</h2>
                <p>Your AI Assistant</p>
            </div>
            <span class="status">● Online</span>
        </header>

        <!-- Chat Messages -->
        <main class="chat-box" id="chat-box">

            <div class="message bot-message">
                <div class="avatar">S</div>

        <div class="message-content">Hello! 👋 Welcome to SmartChat.<br>I'm your AI assistant. How can I help you today?</div>

        </main>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typing-indicator">
            SmartChat is thinking...
        </div>

        <!-- Chat Input -->
        <footer class="chat-footer">
            <input
                type="text"
                id="user-input"
                placeholder="Type your message..."
                autocomplete="off"
            >
            <button id="send-btn" onclick="sendMessage()">Send ➤</button>
        </footer>

        <!-- New Conversation Button -->
        <button class="new-chat-btn" onclick="newConversation()">
            + New Conversation
        </button>

    </div>

    <!-- Markdown formatting -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- HTML sanitization -->
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

<!-- SmartChat JavaScript -->
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
